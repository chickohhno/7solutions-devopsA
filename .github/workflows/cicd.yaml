
name: Hello API CI/CD

on:
  push:
    branches: [master]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/cicd.yaml'

  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: write

concurrency:
  group: hello-api-master-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test and vet application
        run: |
          go test ./...
          go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: chickohhno/hello-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update production Kustomize tag
        run: |
          FILE=k8s/overlays/production/kustomization.yaml

          git fetch origin master
          git checkout -B master origin/master

          sed -i -E "s|^([[:space:]]*newTag:[[:space:]]*).*|\1${IMAGE_TAG}|" "$FILE"

          grep -Fq "newTag: ${IMAGE_TAG}" "$FILE"

      - name: Commit image tag for Argo CD
        run: |
          FILE=k8s/overlays/production/kustomization.yaml

          if git diff --quiet -- "$FILE"; then
            echo "Kustomize already references ${IMAGE_TAG}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git commit -m "ci: deploy hello-api ${IMAGE_TAG}"
          git push origin HEAD:master
