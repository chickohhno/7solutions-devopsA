
---
- name: Create Node Exporter group
  ansible.builtin.group:
    name: "{{ node_exporter_user }}"
    system: true
    state: present

- name: Create dedicated Node Exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Download Node Exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/var/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    checksum: "sha256:{{ node_exporter_sha256 }}"
    mode: "0644"

- name: Extract Node Exporter archive
  ansible.builtin.unarchive:
    src: "/var/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /var/tmp
    remote_src: true
    creates: "/var/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/var/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart Node Exporter

- name: Create Node Exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Node Exporter

- name: Apply pending service changes
  ansible.builtin.meta: flush_handlers

- name: Ensure Node Exporter is enabled and running
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true

- name: Verify Node Exporter metrics endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
    status_code: 200
  register: exporter_check
  retries: 5
  delay: 2
  until: exporter_check.status == 200
