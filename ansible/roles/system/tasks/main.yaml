
---
- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - ca-certificates
    state: present
